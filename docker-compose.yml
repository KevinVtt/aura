services:

  frontend:
    build: ./frontend/aura-frontend
    ports:
      - "3000:80"
    mem_limit: 128m
    depends_on:
      - backend

  backend:
    build: ./backend/project-aura
    ports:
      - "8080:8080"
    environment:
      - IA_SERVICE_URL=http://ia:8000
      - DB_URL=jdbc:postgresql://db:5432/aura_db
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@aura.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
    mem_limit: 768m
    depends_on:
      - ia
      - db

  # El servicio IA no publica puerto: solo lo consume el backend por la red interna.
  ia:
    build: ./aura_chatbot
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - chroma_data:/app/chroma_db
      - ia_data:/app/data
      - pdfs_data:/app/pdfs
    mem_limit: 512m
    depends_on:
      - ollama
      - ollama-pull

  # Descarga el modelo de embeddings una vez por arranque; sin él la IA no puede indexar.
  ollama-pull:
    image: ollama/ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull nomic-embed-text"
    mem_limit: 512m
    depends_on:
      - ollama
    restart: "no"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 2.5g
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_NUM_PARALLEL=1

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: aura_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    mem_limit: 512m

volumes:
  ollama_data:
  chroma_data:
  ia_data:
  pdfs_data:
  pg_data: